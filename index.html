<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liga Universitaria</title>
    <link rel="icon" type="image/png" href="Logo.png" />

    <!-- Aplica el tema guardado (claro/oscuro) antes de dibujar, para que no "parpadee" -->
    <script>
      try {
        var t = localStorage.getItem("liga-tema");
        if (t) document.documentElement.dataset.tema = t;
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
